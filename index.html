<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Secure Dynamic Task Manager</h1>

    <div class="task-form">
      <input id="taskInput" type="text" placeholder="Enter a task">
      <button id="addTaskBtn" type="button">Add Task</button>
      <button id="loadSamplesBtn" type="button">Load Sample Tasks</button>
    </div>

    <p id="taskMessage" class="message"></p>

    <div class="summary">
      <span>Total: <strong id="totalCount">0</strong></span>
      <span>Pending: <strong id="pendingCount">0</strong></span>
      <span>Completed: <strong id="completedCount">0</strong></span>
    </div>

    <ul id="taskList"></ul>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
